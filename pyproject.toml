[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decomposition"
version = "0.0.3"
description = "Continuous windowed hidden-state extraction for speech audio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "phraser @ git+https://github.com/martijnbentum/phraser.git",
  "to-vector @ git+https://github.com/martijnbentum/to_vector.git",
]

[tool.setuptools]
packages = ["decomposition"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
