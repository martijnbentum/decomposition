[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decomposition"
version = "0.0.8"
description = "Continuous windowed hidden-state extraction for speech audio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "phraser @ git+https://github.com/martijnbentum/phraser.git",
  "progressbar2>=4.5.0",
  "scikit-learn>=1.5",
  "to-vector @ git+https://github.com/martijnbentum/to_vector.git",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "transformers==5.4.0",
]

# CUDA 12.6 wheels on Linux; default PyPI wheels elsewhere.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools]
packages = ["decomposition"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
